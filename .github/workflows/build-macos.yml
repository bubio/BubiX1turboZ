name: Build macOS (arm64)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'assets/**'
      - '*.nimble'
      - 'mise.toml'
      - 'scripts/**'
      - '.github/workflows/build-macos.yml'
      - '.github/workflows/publish-release-assets.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'assets/**'
      - '*.nimble'
      - 'mise.toml'
      - 'scripts/**'
      - '.github/workflows/build-macos.yml'
      - '.github/workflows/publish-release-assets.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  build:
    # Apple silicon runner: the build is arm64-only for now (universal
    # binaries are future work - see docs, phase list).
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    # The SDL2 framework is a pinned upstream release, so it only needs
    # downloading again when scripts/fetch_sdl2_framework.sh changes the
    # version it pins.
    - name: Cache SDL2 framework
      uses: actions/cache@v4
      with:
        path: build/frameworks
        key: sdl2-framework-${{ hashFiles('scripts/fetch_sdl2_framework.sh') }}

    # mise.toml is the single source of truth for the Nim version, shared
    # with local builds. `nim` comes from a community asdf plugin that mise
    # does not carry in its registry, hence the explicit plugin install.
    - name: Set up mise
      uses: jdx/mise-action@v2
      with:
        install: false

    # `mise trust` is not redundant: mise.toml carries an [env] block, and
    # mise ignores the config of an untrusted directory. Silently dropping
    # it would drop DYLD_LIBRARY_PATH="" with it - the setting that keeps
    # the toolchain from breaking the app's OpenGL at run time.
    - name: Install Nim toolchain
      run: |
        mise trust
        mise plugins install nim https://github.com/asdf-community/asdf-nim
        mise install

    # -d: dependencies only, read from bubix1turboz.nimble, which pins them
    # to the versions this app is verified against.
    - name: Install Nim dependencies
      run: mise exec -- nimble install -d -y

    # A release build additionally produces the dmg; everything else stops
    # at the .app, which is enough to catch a broken build.
    - name: Build .app bundle
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          ./scripts/build_macos.sh --dmg
        else
          ./scripts/build_macos.sh
        fi

    # The icon and the tint colour both come from the committed asset
    # catalog. Losing it costs no build step and would go unnoticed
    # otherwise - the app still builds, it just ships with the wrong icon
    # at small sizes and the system tint colour.
    - name: Verify asset catalog was embedded
      run: |
        test -f build/BubiX1turboZ.app/Contents/Resources/Assets.car
        test -f build/BubiX1turboZ.app/Contents/Resources/AppIcon.icns
        plutil -p build/BubiX1turboZ.app/Contents/Info.plist \
          | grep -q NSAccentColorName
        plutil -p build/BubiX1turboZ.app/Contents/Info.plist \
          | grep -q CFBundleIconName

    - name: Package .app (zip)
      if: github.event_name != 'release'
      run: |
        ditto -c -k --sequesterRsrc --keepParent \
          build/BubiX1turboZ.app \
          build/bubix1turboz-macos-arm64.zip

    - name: Upload .app artifact
      if: github.event_name != 'release'
      uses: actions/upload-artifact@v4
      with:
        name: bubix1turboz-macos-arm64
        path: build/bubix1turboz-macos-arm64.zip
        if-no-files-found: error

    - name: Upload dmg artifact
      if: github.event_name == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: bubix1turboz-macos-arm64-dmg
        path: build/bubix1turboz-*-macos-arm64.dmg
        if-no-files-found: error

  publish-release:
    if: github.event_name == 'release'
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release-assets.yml
    with:
      asset-patterns: |
        *.dmg
