# Toolchain pinned for BubiX1turboZ.
#
# The Nim compiler version is pinned here rather than in the .nimble file: the
# .nimble version identifies the application, not the toolchain that builds it.
# CI reads this same file (jdx/mise-action) so local and CI builds agree.
#
# `nim` comes from the community asdf plugin, which mise does not carry in its
# registry. Install it once with:
#
#   mise plugins install nim https://github.com/asdf-community/asdf-nim

[tools]
nim = "2.2.10"

[env]
# Neutralised deliberately. The asdf-nim plugin's exec-env exports
# DYLD_LIBRARY_PATH=/opt/homebrew/lib on Apple Silicon so the Nim compiler
# can find Homebrew libraries (see its bin/exec-env). That variable applies
# to *every* process started from a shell with this project active,
# including the emulator itself - and /opt/homebrew/lib contains Mesa's
# libGL.1.dylib, which then shadows the libGL that Apple's
# OpenGL.framework expects. SDL's Cocoa backend touches
# +[NSOpenGLContext currentContext] while creating its window, that call
# lands in the wrong library, and the app dies with SIGBUS before it can
# draw anything. `open build/BubiX1turboZ` was unaffected only because
# LaunchServices does not pass the shell's environment on.
#
# The build does not need it: scripts/build_app_macos_dev.sh passes
# -L/opt/homebrew/lib explicitly.
DYLD_LIBRARY_PATH = ""
